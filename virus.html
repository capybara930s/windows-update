<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Actualización del Sistema</title>
    <style>
        * { box-sizing: border-box; user-select: none; }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000000; color: #ffffff;
            font-family: 'Segoe UI', sans-serif;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden; cursor: none;
        }
        .container { text-align: center; max-width: 600px; }
        .spinner { position: relative; width: 60px; height: 60px; margin: 0 auto 40px auto; }
        .dot {
            position: absolute; width: 6px; height: 6px; background: white; border-radius: 50%;
            animation: spin 3.5s cubic-bezier(0.1, 0.9, 0.2, 1) infinite; opacity: 0;
        }
        .dot:nth-child(1) { animation-delay: 0.15s; }
        .dot:nth-child(2) { animation-delay: 0.3s; }
        .dot:nth-child(3) { animation-delay: 0.45s; }
        .dot:nth-child(4) { animation-delay: 0.6s; }
        .dot:nth-child(5) { animation-delay: 0.75s; }
        @keyframes spin {
            0% { transform: rotate(0deg); opacity: 1; }
            50% { transform: rotate(180deg); opacity: 1; }
            100% { transform: rotate(360deg); opacity: 0; }
        }
        h1 { font-size: 22px; font-weight: 300; margin-bottom: 10px; }
        p { font-size: 15px; color: #cccccc; margin: 5px 0; }
    </style>
</head>
<body>

    <div class="container">
        <div class="spinner">
            <div class="dot" style="transform: rotate(0deg) translate(25px);"></div>
            <div class="dot" style="transform: rotate(30deg) translate(25px);"></div>
            <div class="dot" style="transform: rotate(60deg) translate(25px);"></div>
            <div class="dot" style="transform: rotate(90deg) translate(25px);"></div>
            <div class="dot" style="transform: rotate(120deg) translate(25px);"></div>
        </div>
        <h1 id="texto">Instalando actualizaciones críticas...</h1>
        <p id="porcentaje">Completado: 0%</p>
        <p>No apague el equipo. Esto puede tardar unos minutos.</p>
    </div>

    <script>
        let progreso = 0;
        const txtPorcentaje = document.getElementById('porcentaje');
        const txtPrincipal = document.getElementById('texto');

        setInterval(() => {
            if (progreso < 99) {
                progreso += Math.floor(Math.random() * 3) + 1;
                if (progreso > 99) progreso = 99;
                txtPorcentaje.innerText = `Completado: ${progreso}%`;
            } else {
                txtPrincipal.innerText = "Error crítico en el disco duro. Reintentando...";
                setTimeout(() => {
                    progreso = 0;
                    txtPrincipal.innerText = "Instalando actualizaciones críticas...";
                }, 4000);
            }
        }, 3000);

        document.body.addEventListener('click', () => {
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen();
            } else if (document.documentElement.webkitRequestFullscreen) {
                document.documentElement.webkitRequestFullscreen();
            }
        });

        window.addEventListener('keydown', (e) => {
            if (e.key === 'F5' || (e.ctrlKey && e.key === 'r')) {
                e.preventDefault();
            }
        });
    </script>
</body>
</html>
